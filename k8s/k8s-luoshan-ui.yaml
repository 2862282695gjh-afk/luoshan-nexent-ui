apiVersion: v1
kind: ConfigMap
metadata:
  name: luoshan-ui-config
  namespace: nexent
data:
  HOST: '0.0.0.0'
  PORT: '5180'
  NEXENT_BASE_URL: 'http://10.20.6.120:30013'
  NEXENT_AGENT_NAME: 'general_assistant'
  EMBED_ALLOWED_ORIGINS: ''
  NEXENT_MAIN_API_URL: ''
  NEXENT_AUTOMATION_AUTH_MODE: 'jwt'
  NEXENT_AUTOMATION_AGENT_ID: ''
  NEXENT_AGENT_API_URL: ''
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luoshan-ui
  namespace: nexent
  labels:
    app: luoshan-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: luoshan-ui
  template:
    metadata:
      labels:
        app: luoshan-ui
    spec:
      containers:
        - name: luoshan-ui
          image: luoshan-nexent-ui:v20261116
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5180
          envFrom:
            - configMapRef:
                name: luoshan-ui-config
            - secretRef:
                name: luoshan-ui-secret
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: luoshan-ui
  namespace: nexent
spec:
  type: NodePort
  selector:
    app: luoshan-ui
  ports:
    - name: http
      port: 5180
      targetPort: http
      nodePort: 30180
